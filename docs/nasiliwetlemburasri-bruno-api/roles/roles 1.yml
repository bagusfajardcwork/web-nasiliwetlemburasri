info:
  name: roles
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/roles"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: json
    data: |-
      {
        "name": "editor",
        "description": "Role untuk mengelola data tertentu",
        "permissionIds": [
          1,
          3
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
