info:
  name: users paging
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/users?page=1&perPage=2"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: perPage
      value: "2"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
