info:
  name: users by search
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/users?search=staff"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: search
      value: staff
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
