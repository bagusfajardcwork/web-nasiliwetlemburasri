info:
  name: users by role
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/users?role=administrator"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: role
      value: administrator
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
