info:
  name: users by combination
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/users?page=1&perPage=1&search=admin&is_active=true&role=admin"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: perPage
      value: "1"
      type: query
    - name: search
      value: admin
      type: query
    - name: is_active
      value: "true"
      type: query
    - name: role
      value: admin
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
