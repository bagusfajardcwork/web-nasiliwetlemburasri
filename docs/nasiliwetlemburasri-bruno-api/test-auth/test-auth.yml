info:
  name: test-auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/test-auth"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
