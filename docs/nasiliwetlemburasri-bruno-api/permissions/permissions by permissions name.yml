info:
  name: permissions by permissions name
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/permissions?search=users"
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: search
      value: users
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
